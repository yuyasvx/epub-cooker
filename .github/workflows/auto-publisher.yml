name: Auto Publisher

on:
  workflow_dispatch:
    inputs:
      dry-run:
        required: false
        default: false
        type: boolean
        description: "パッケージ公開まではやらないようにする"
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  tag:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # PRがマージされており、かつマージ元のブランチ名が一致する場合のみ実行
    if: (github.event_name == 'workflow_dispatch') || (github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'release/')))

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #6.0.1

      - name: Create and Push Tag
        env:
          # release/v1.0.0 のような文字列を取得
          RAW_BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # "release/" の部分を削除してタグ名（v1.0.0など）を抽出
          TAG_NAME=${RAW_BRANCH_NAME#release/}

          echo "Target tag name: $TAG_NAME"

          # Gitのユーザー設定（Action実行用に必要）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # タグの作成
          git tag $TAG_NAME

          if [ "${{ inputs.dry-run }}" != "true" ]; then
            git push origin $TAG_NAME
          else
            echo "Dry run enabled: Skipping tag push"
          fi
  publish:
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f #6.1.0
        with:
          node-version: 24.12.0
          registry-url: https://npm.pkg.github.com
          scope: "@yuyasvx"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache npm directory
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb #5.0.1
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add a namespace to the package name
        run: npm run package:github

      - name: Publish package
        if: inputs.dry-run == false
        run: npm publish --provenance --access public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
