name: Release/Prepare

on:
  workflow_dispatch:
    inputs:
      target-version:
        description: "リリース時のバージョン番号(x.y.z 形式。接頭辞のvなどは不要)"
        required: true
        type: string

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #6.0.1
      - name: Check existing tags
        run: |
          git fetch --prune --unshallow --tags
          count=$(git tag -l "v${{ inputs.target-version }}" | wc -l)
          if [ $count -gt 0 ]; then
            echo "version ${{ inputs.target-version }} already exists"
            exit 1
          fi
      - name: Create release branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git switch -c release/v${{ inputs.target-version }}
          git push --set-upstream origin release/v${{ inputs.target-version }}
      - name: Update version in package.json
        run: npm run package:version ${{ inputs.target-version }}
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Release ${{ inputs.target-version }}"
          git push origin release/v${{ inputs.target-version }}
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Release v${{ inputs.target-version }}" \
            --base main \
            --head release/v${{ inputs.target-version }} \
            --body "Publish v${{ inputs.target-version }}"
